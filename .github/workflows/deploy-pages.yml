name: Spiel online stellen (GitHub Pages)

on:
  push:
    branches: [main, master, feature/carrier-stationing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Produktions-Build
        run: npm run build:pages

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
